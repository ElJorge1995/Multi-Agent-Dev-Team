<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Bot icon (lucide-react Bot, simplified for favicon) -->
  <!-- Head -->
  <rect x="8" y="11" width="16" height="12" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="16" y1="7" x2="16" y2="11" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="6" r="1.5" fill="white"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="16" r="1.5" fill="white"/>
  <circle cx="19.5" cy="16" r="1.5" fill="white"/>
  <!-- Mouth -->
  <line x1="12" y1="20" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="8" y1="15" x2="5" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="15" x2="27" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
